[package]
name = "mod-better-ping-display"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Better Ping Display, a native mod: the numeric ping next to each entry in the player list. 1:1 port of vladmarica/better-ping-display-fabric (MIT)."

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
